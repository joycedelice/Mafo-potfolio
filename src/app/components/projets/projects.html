<section class="projects-section" id="projets">
  <div class="container">
    <div class="section-header">
      <span class="sub-title">—PROJETS—</span>
      <h2 class="main-title">Mes projets récents</h2>
    </div>

    <div class="projects-grid">
      @for (project of projects; track project.title) {
        <div class="project-card">
          
          <div class="project-image-wrapper">
            <img [src]="project.image" [alt]="project.title" class="project-image" />
          </div>

          <div class="project-content">
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-description">{{ project.description }}</p>

            <div class="project-tags">
              @for (tag of project.tags; track tag) {
                <span class="tag">{{ tag }}</span>
              }
            </div>

            <div class="project-links">
              <a [href]="project.demoUrl" target="_blank" class="btn btn-demo">
                <span>Voir la démo</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
              </a>

              <a [href]="project.githubUrl" target="_blank" class="btn btn-github">
                <span>Code GitHub</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                  <path d="M9 19c-5 1.5-5-2.5-7-2m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                </svg>
              </a>
            </div>
          </div>

        </div>
      }
    </div>
  </div>
</section>
