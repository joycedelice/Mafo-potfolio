<section class="hero-section" id="accueil">
  <div class="hero-container">

    <!-- Colonne Gauche : Textes & Actions -->
    <div class="hero-content">

      <!-- Badge de bienvenue -->
      <div class="welcome-badge">
        <span class="badge-text">Bienvenue sur mon portfolio</span>
      </div>

      <!-- Titre principal -->
      <h1 class="hero-title">
        Je suis <span class="highlight-purple">Joyce Mafo</span><br>
        <span class="job-title">Développeuse frontend</span>
        <span class="cursor">|</span>
      </h1>

      <!-- Description -->
      <p class="hero-description">
        Passionnée par le développement web, je conçois des interfaces web modernes , intuitives et eleganntes en
        mettant l'accent sur l'experience utilisateur et la qualite du design .
      </p>

      <!-- Boutons d'action -->
      <div class="hero-actions">
        <button class="btn btn-primary" (click)="scrollToProjects()">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Voir mes projets
        </button>

        <a href="#contact" class="btn btn-outline">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          Me contacter
        </a>
      </div>

      <!-- Réseaux sociaux -->
      <div class="social-links">
        <a href="https://github.com/joycedelice" target="_blank" aria-label="GitHub" class="social-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
            </path>
          </svg>
        </a>

        <a href="https://www.linkedin.com/in/joyce-délice-mafo-tadie-36b943430?utm_source=share_via&utm_content=profile&utm_medium=member_android"
          target="_blank" aria-label="LinkedIn" class="social-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>

        <a href="mailto:joycedelicemafo@gmail.com" class="social-icon" aria-label="Email">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </div>

    </div>

    <!-- Colonne Droite : Visuel & Photo circulaire -->
    <div class="hero-visual">
      <!-- Effet de Halo lumineux & Cercle orbital -->
      <div class="glow-bg"></div>
      <div class="orbit-circle"></div>

      <!-- Photo circulaire avec anneau dégradé -->
      <div class="avatar-wrapper">
        <div class="avatar-ring">
          <div class="avatar-photo">
            <img src="images/profil.png" alt="Joyce Mafo - Développeuse Full Stack" width="360" height="360"
              fetchpriority="high" />
          </div>
        </div>

        <!-- Icônes de langages flottantes -->
        <!-- Icônes de langages flottantes -->
        <div class="tech-badge badge-angular" style="animation-delay:0s">
          <img src="images/icons/angularjs-original.svg" alt="Angular" width="30" height="30" loading="lazy">
        </div>
        <div class="tech-badge badge-typescript" style="animation-delay:0.6s">
          <img src="images/icons/typescript-original.svg" alt="TypeScript" width="30" height="30" loading="lazy">
        </div>
        <div class="tech-badge badge-js" style="animation-delay:1.2s">
          <img src="images/icons/javascript-original.svg" alt="JavaScript" width="30" height="30" loading="lazy">
        </div>
        <div class="tech-badge badge-html" style="animation-delay:0.3s">
          <img src="images/icons/html5-original.svg" alt="HTML5" width="30" height="30" loading="lazy">
        </div>
        <div class="tech-badge badge-css" style="animation-delay:0.9s">
          <img src="images/icons/css3-original.svg" alt="CSS3" width="30" height="30" loading="lazy">
